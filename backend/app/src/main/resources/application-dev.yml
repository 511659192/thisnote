# 插件开发模式（profile: dev）
#
#   cd backend && java -jar app/target/thisnode-backend.jar --spring.profiles.active=dev
#
# 与生产（默认）的差别只有一个：**插件从 target/classes 直接加载，而不是从 runtime/plugins/*.jar**。
# 于是改插件代码只要重新编译那个模块（IDE 里 Build，或 `mvn -pl plugin-<id> compile`），
# 再在设置 → 插件里点「重载」（或调 POST /api/plugins/reload?pluginId=<id>）就生效，不用打包也不用重启应用。
#
# 目录约定（由 backend/tools/dev_plugins.ps1 建立，应用从 backend/ 启动 → plugins-dev 在 backend/ 下）：
#
#   plugins-dev/memory-cycle/
#     ├── plugin.properties     <- 从 target/classes/plugin.properties 拷贝（描述符在插件目录根）
#     └── classes -> plugin-memory-cycle/target/classes   （目录联接）
#
# classes 直接联接到 Maven 的 target/classes，正好是 PF4J 开发模式的默认布局（`classes/`），
# 所以这里**不需要** classes-directories / lib-directories（插件没有只属于自己 jar 的依赖）。
#
# 没有数据源要加载了：`mysql` profile 已随数据库层一起删除，单给 `dev` 即可。
spring:
  sbp:
    runtime-mode: DEVELOPMENT
    plugins-root: plugins-dev
