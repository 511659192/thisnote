server:
  port: ${THISNODE_PORT:45917}
  address: 127.0.0.1
  shutdown: graceful

spring:
  # SBP 会传递引入 Flyway；本应用不连数据库，留着只是防它去动别的库。
  flyway:
    enabled: false
  # SBP：插件式扩展。插件 jar 放在应用工作目录的 plugins/ 下（交付形态见 README），
  # 要用"开发模式"（从 target/classes 直接加载插件、免打包）见 application-dev.yml。
  sbp:
    enabled: true
    # 官方管理端点（PluginManagerController）：/sbp/list、/sbp/start|stop|reload/{id}、/sbp/reload-all。
    # 界面上的插件管理页走我们自己的 /api/plugins（那边有配置、健康、per-entity 状态与停用闸门），
    # 这一份留给运维与脚本；服务只监听 127.0.0.1，不存在对外暴露。
    controller:
      base-path: /sbp
  application:
    name: thisnode-backend
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      # Boot 默认的 /** 静态资源映射必须关掉，改由 SpaResourceConfig 自己注册：
      # SBP 的 PluginResourceHandlerRegistrationCustomizer 会往 Boot 的资源链上挂它的
      # PluginResourceResolver，而那个 resolver 的 `@Autowired @Lazy PluginManager` 拿不到时
      # 回落到 ApplicationContextProvider 按**调用方类加载器**查上下文 —— 主应用的上下文从未
      # 注册进去（只有各插件的注册，见 SBP 的 SpringBootPlugin.start()），于是 PluginManager
      # 为 null，任何走该链的路径（含 /api 未命中与 /error）统一 500。
      # 插件前端产物与这件事无关：它由 PluginAssetController 走 /plugin-assets 端出。
      add-mappings: false

thisnode:
  # Set by the Tauri shell: exit when the parent closes our stdin (orphan protection).
  # Left false so running the jar by hand is unaffected.
  exit-on-stdin-close: ${THISNODE_EXIT_ON_STDIN_CLOSE:false}

logging:
  level:
    root: INFO
    com.thisnode: INFO
  file:
    name: ${user.home}/.thisnode/logs/backend.log
