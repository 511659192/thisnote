server:
  port: ${THISNODE_PORT:45917}
  address: 127.0.0.1
  shutdown: graceful

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  # SBP 会传递引入 Flyway；本应用不连数据库，留着只是防它去动别的库。
  flyway:
    enabled: false
  # SBP：插件式扩展。插件交付目录为 **backend/runtime/plugins/**（相对应用工作目录；应用从 backend/ 启动，
  # 交付形态 = app jar + runtime/plugins/，丢一个 jar 进去就能装）。开发模式见 application-dev.yml。
  sbp:
    enabled: true
    # 插件目录：相对应用工作目录（约定从 backend/ 启动，即 backend/runtime/plugins/）。
    plugins-root: runtime/plugins
    # 插件界面产物由界面侧工具构建并交付到 frontend/runtime/plugins/<id>/；公共 URL 仍为 /plugin-assets/<id>/。
    # 官方管理端点（PluginManagerController）：/sbp/list、/sbp/start|stop|reload/{id}、/sbp/reload-all。
    # 界面上的插件管理页走我们自己的 /api/plugins/get 等动作接口（那边有插件级启停、健康与停用闸门），
    # 这一份留给运维与脚本；服务只监听 127.0.0.1，不存在对外暴露。
    controller:
      base-path: /sbp
  application:
    name: thisnode-backend
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      # 纯 API：后端不端出任何静态资源（宿主界面由界面侧独立提供与部署）。
      # 这行同时是护栏：Boot 默认资源链不注册，SBP 的 PluginResourceHandlerRegistrationCustomizer
      # 就没有挂载点 —— 那个 resolver 的 PluginManager 在主应用里恒为 null，一旦挂上默认链，
      # 任何走链的路径（含 /api 未命中与 /error）统一 500（实测坑，勿改回 true）。
      add-mappings: false

logging:
  level:
    root: INFO
    com.thisnode: INFO
  file:
    name: ${user.home}/.thisnode/logs/backend.log
