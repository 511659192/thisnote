# SBP/PF4J 插件描述符（由 PF4J 的 PropertiesPluginDescriptorFinder 读取）。
plugin.id=attachment-importer
plugin.class=com.thisnote.ext.attachmentimporter.AttachmentImporterPlugin
plugin.version=@project.version@
plugin.provider=thisnote
# 需要 plugin-api 的 AttachmentQueryEvent 与 AttachmentAdoptEvent
plugin.requires=>=0.0.1
# 依赖 notes：附件引用查询与笔记/卡片创建都通过它完成
plugin.dependencies=notes
