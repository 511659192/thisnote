# SBP/PF4J 插件描述符（由 PF4J 的 PropertiesPluginDescriptorFinder 读取）。
# plugin.version 由 Maven 过滤注入 —— 版本只在父 pom 写一次，避免"jar 里写的版本和实际构建对不上"。
plugin.id=favorite
plugin.class=com.thisnode.ext.favorite.FavoritePlugin
plugin.version=@project.version@
plugin.provider=thisnote
plugin.dependencies=
# 无插件依赖：收藏状态在本插件自己的文件里，笔记标题/预览由调用方与核心数据拼装
