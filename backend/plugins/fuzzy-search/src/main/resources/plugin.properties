# SBP/PF4J 插件描述符（由 PF4J 的 PropertiesPluginDescriptorFinder 读取）。
# plugin.version 由 Maven 过滤注入 —— 版本只在父 pom 写一次，避免"jar 里的版本和实际构建对不上"。
plugin.id=fuzzy-search
plugin.class=com.thisnode.ext.fuzzysearch.FuzzySearchPlugin
plugin.version=@project.version@
plugin.provider=thisnote
plugin.dependencies=
# 无插件依赖也无端点：顶栏模糊查询纯界面侧（标题/摘要匹配 + 下拉跳转），jar 只承担"存在与启停"
