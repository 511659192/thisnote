# SBP/PF4J 插件描述符（由 PF4J 的 PropertiesPluginDescriptorFinder 读取）。
# plugin.version 由 Maven 过滤注入（根 pom 的 plugins profile）—— 版本只在父 pom 写一次。
plugin.id=notes
plugin.class=com.thisnode.ext.notes.NotesPlugin
plugin.version=@project.version@
plugin.provider=thisnote
# 契约版本（PF4J 原生 requires，semver 范围；平台用 PF4J 的 VersionManager 校验）
# 说明文案不写在这里：PF4J 的 properties finder 按 ISO-8859-1 读，中文会乱码 —— 见 PluginRegister#description()
plugin.requires=>=5.3.0
# 笔记核心无 pf4j 依赖：它是被依赖的一方（favorite / memory-cycle / baidu-pan / card-importer 依赖它）。
plugin.dependencies=
